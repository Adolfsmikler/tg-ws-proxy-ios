name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: Patch GlassEffect Bug
        run: sed -i '' 's/\.glassEffect.*//g' ios/TgWsProxy/UI/GlassTheme.swift

      - name: Install Rust iOS Target
        run: rustup target add aarch64-apple-ios

      - name: Make script executable
        run: chmod +x build.sh

      - name: Run Build Script
        env:
          OTHER_SWIFT_FLAGS: "-strict-concurrency=minimal -suppress-warnings"
        run: ./build.sh -p side -c la

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-sideload
          path: dist/*.ipa
