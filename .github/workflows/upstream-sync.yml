name: Sync Rust upstream

on:
  schedule:
    - cron: "17 4 * * 1" # Автоматический запуск каждый понедельник в 04:17 UTC
  workflow_dispatch: # Возможность запустить руками одной кнопкой

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest # Переключили на быстрый и стабильный Linux вместо дорогого Mac
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Принудительно скачиваем все вложенные субмодули

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Sync amurcanov Rust upstream
        run: |
          # Даем права на запуск скрипту синхронизации
          chmod +x ./scripts/sync-rust-upstream.sh
          # Запускаем оригинальный процесс подтягивания апстрима
          ./scripts/sync-rust-upstream.sh

      - name: Check Rust core
        run: cargo check --manifest-path src-wrapper/Cargo.toml --locked

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/rust-upstream
          delete-branch: true
          commit-message: "chore: sync Rust upstream"
          title: "chore: sync Rust upstream"
          body: |
            Автоматическая еженедельная синхронизация Rust-ядра из апстрима `amurcanov/tg-ws-proxy-android`.

            Патч iOS FFI был автоматически переналожен, и компиляция Rust-ядра успешно проверена перед созданием этого Pull Request.
