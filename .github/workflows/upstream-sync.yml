name: Sync Rust upstream

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Hard Clone Rust Core (Submodule Bypass)
        run: |
          rm -rf vendor/tg-ws-proxy-android
          mkdir -p vendor
          git clone --depth=1 "https://github.com" "vendor/tg-ws-proxy-android"

      - name: Sync amurcanov Rust upstream
        run: |
          chmod +x ./scripts/sync-rust-upstream.sh
          ./scripts/sync-rust-upstream.sh

      - name: Check Rust core
        run: cargo check --manifest-path src-wrapper/Cargo.toml --locked

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/rust-upstream
          delete-branch: true
          commit-message: "chore: sync Rust upstream"
          title: "chore: sync Rust upstream"
          body: |
            Automated weekly synchronization from `amurcanov/tg-ws-proxy-android`.
