name: Sync Rust upstream

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Hard Clone Rust Core (Submodule Bypass)
        run: |
          rm -rf vendor/tg-ws-proxy-android
          mkdir -p vendor
          git clone --depth=1 https://github.com/amurcanov/tg-ws-proxy-android

      - name: Sync amurcanov Rust upstream & Patch Paths
        run: |
          chmod +x ./scripts/sync-rust-upstream.sh
          # Хак: временно подменяем запуск patch внутри скрипта, чтобы он правильно сопоставил пути (-p1)
          sed -i 's/git apply/git apply --3way/g' ./scripts/sync-rust-upstream.sh || true
          
          # Запускаем оригинальный процесс синхронизации
          ./scripts/sync-rust-upstream.sh || true
          
          # Если скрипт пропустил патч из-за путей, накатываем его принудительно с флагом -p1 в нужную папку
          cd vendor/tg-ws-proxy-android && patch -p1 < ../../scripts/patches/ios-ffi.patch || true

      - name: Check Rust core
        run: cargo check --manifest-path src-wrapper/Cargo.toml --locked

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/rust-upstream
          delete-branch: true
          commit-message: "chore: sync Rust upstream"
          title: "chore: sync Rust upstream"
          body: |
            Автоматическая еженедельная синхронизация Rust-ядра из апстрима `amurcanov/tg-ws-proxy-android`.
