name: Sync Rust upstream

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачиваем полную историю для корректной работы git merge

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Force Init Git Submodules
        run: |
          # Принудительно регистрируем, сбрасываем и скачиваем субмодули вручную
          git submodule deinit -f . || true
          git submodule update --init --recursive --force

      - name: Sync amurcanov Rust upstream
        run: |
          chmod +x ./scripts/sync-rust-upstream.sh
          ./scripts/sync-rust-upstream.sh

      - name: Check Rust core
        run: cargo check --manifest-path src-wrapper/Cargo.toml --locked

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/rust-upstream
          delete-branch: true
          commit-message: "chore: sync Rust upstream"
          title: "chore: sync Rust upstream"
          body: |
            Автоматическая еженедельная синхронизация Rust-ядра из апстрима `amurcanov/tg-ws-proxy-android`.

            Патч iOS FFI был автоматически переналожен, и компиляция Rust-ядра успешно проверена перед созданием этого Pull Request.
