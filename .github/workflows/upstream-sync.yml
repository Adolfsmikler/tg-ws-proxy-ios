name: Sync Rust upstream

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Hard Clone Rust Core (Submodule Bypass)
        run: |
          rm -rf vendor/tg-ws-proxy-android
          mkdir -p vendor
          git clone --depth=1 https://github.com/amurcanov/tg-ws-proxy-android

      - name: Apply iOS FFI Patch & Prepare Src-Wrapper
        run: |
          # 1. Принудительно накатываем патч совместимости с iOS в папку ядра с флагом -p1
          cd vendor/tg-ws-proxy-android
          patch -p1 < ../../scripts/patches/ios-ffi.patch
          cd ../..
          
          # 2. Полностью обновляем рабочую директорию src-wrapper для компиляции
          rm -rf src-wrapper/src
          mkdir -p src-wrapper/src
          cp -R vendor/tg-ws-proxy-android/src/* src-wrapper/src/
          cp vendor/tg-ws-proxy-android/Cargo.toml src-wrapper/Cargo.toml
          cp vendor/tg-ws-proxy-android/Cargo.lock src-wrapper/Cargo.lock
          
          # 3. Записываем хэш коммита для истории, как это делал оригинальный скрипт
          cd vendor/tg-ws-proxy-android
          git rev-parse HEAD > ../../src-wrapper/UPSTREAM_COMMIT
          cd ../..

      - name: Check Rust core
        run: cargo check --manifest-path src-wrapper/Cargo.toml --locked

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/rust-upstream
          delete-branch: true
          commit-message: "chore: sync Rust upstream"
          title: "chore: sync Rust upstream"
          body: |
            Автоматическая еженедельная синхронизация Rust-ядра из апстрима `amurcanov/tg-ws-proxy-android`.

            Все файлы ядра успешно синхронизированы в src-wrapper, патч iOS FFI наложен, и компиляция проверена.
